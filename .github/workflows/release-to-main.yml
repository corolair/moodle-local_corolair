# Builds the production tree from develop and opens a pull request into main.
#
# main is generated, never hand-merged. The endpoints used to be branch-specific in eighteen
# files, so every develop -> main merge was a conflict, and a line main had never counter-changed
# was taken from develop silently -- which is how development endpoints reached a release once
# already. This workflow performs that transform the same way every time, and proves it before
# asking for a merge.
#
# It never pushes to main and never merges. It only creates release/<version> and opens the pull
# request; the merge stays a human decision. Branch protection on main (require a pull request,
# require the ci-passed check) is what makes that a property of the repository rather than of
# this file.
name: Release to main

on:
  push:
    branches: [develop]
  workflow_dispatch:

# A second push while the first run is mid-transform would race on the same branch.
concurrency:
  group: release-to-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # Both branches are needed as real refs, so no shallow clone.
          fetch-depth: 0

      - name: Build the production tree
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch is named for the release it carries, read from develop rather than from the
          # checkout, so the name is decided before the tree is touched.
          release=$(git show origin/develop:version.php \
            | sed -n "s/.*\$plugin->release *= *'\([^']*\)'.*/\1/p")
          if [ -z "$release" ]; then
            echo "::error::Could not read \$plugin->release from version.php. Not publishing."
            exit 1
          fi
          echo "RELEASE=$release"            >> "$GITHUB_ENV"
          echo "BRANCH=release/$release"     >> "$GITHUB_ENV"

          # Branch from main, then make the tree exactly develop's. Starting from main keeps the
          # pull request diff readable as "what changes in production" rather than replaying
          # every development commit, and read-tree applies deletions as well as changes -- which
          # a `git checkout develop -- .` would silently miss.
          git checkout -B "release/$release" origin/main
          git read-tree --reset -u origin/develop

          # The transform. Both halves matter: the ENV line decides which table is read, and
          # deleting the development table means a released tree cannot resolve to a development
          # host even if that line were somehow wrong.
          sed -i "s/public const ENV = 'develop';/public const ENV = 'production';/" \
            classes/local/environment.php
          rm -f classes/local/hosts_dev.php

          git add -A

      - name: Refuse to publish a tree that still knows a development host
        run: |
          set -euo pipefail
          # The last line of defence, and deliberately not the phpunit guard test: that one ships
          # to customers, so it derives its patterns from the host tables and carries no host name
          # itself. This check can name them outright because .github is export-ignore'd and never
          # reaches the plugin zip.
          if grep -rIn --exclude-dir=.git -e 'corolair\.dev' -e 'corolair\.workers' .; then
            echo "::error::A development host survived the transform. Not publishing."
            exit 1
          fi
          if ! grep -q "public const ENV = 'production';" classes/local/environment.php; then
            echo "::error::The environment was not switched to production. Not publishing."
            exit 1
          fi

      - name: Publish the release branch
        id: publish
        run: |
          set -euo pipefail
          if git diff --quiet origin/main -- .; then
            echo "main already matches this tree; nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Production tree from develop@${GITHUB_SHA:0:7} (${RELEASE})"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An open pull request already tracks the branch, so the force-push above is all the
          # update it needs -- creating a second one would fail and mask the real result.
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" ]; then
            echo "Pull request for ${BRANCH} already open; it now shows the updated tree."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release ${RELEASE} to production" \
            --body "$(cat <<'BODY'
          Generated from `develop` by the **Release to main** workflow. Do not hand-edit this branch.

          The transform applied:

          - `environment::ENV` set to `production`, so the production host table is the one read
          - `classes/local/hosts_dev.php` deleted, so no development host reaches the released plugin

          The workflow refuses to publish if either half fails, and `Moodle Plugin CI` runs the
          full suite against this tree — the production configuration, exercised as production,
          before it ships.

          Review the diff and merge when you are ready. Nothing merges on its own.
          BODY
          )"

      - name: Close superseded release pull requests
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release branch stops being updated the moment version.php names a different one, so
          # its pull request freezes holding an older tree. Left open it is indistinguishable from
          # the current one on the pull request list, and merging it would ship a build older than
          # develop -- quietly, because it was green when it was built.
          #
          # The branch is left in place: for a release that was merged it is the record of what
          # shipped, and for one that was not it costs nothing.
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | select(.headRefName != env.BRANCH) | .number' \
          | while read -r number; do
              [ -n "$number" ] || continue
              echo "Closing superseded release pull request #${number}."
              gh pr comment "$number" --body \
                "Superseded by \`${BRANCH}\`. This branch is no longer updated, so it holds a tree older than \`develop\` — closing so it cannot be merged by mistake."
              gh pr close "$number"
            done
